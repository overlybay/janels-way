<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Portal — Janel's Way</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="charts.js"></script>
  <style>
    .ptab { display: none; }
    .ptab.active { display: block; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="logo" href="index.html">Janel's <span>Way</span></a>
    <nav id="pnav">
      <a href="#" data-tab="progress" class="active">Progress</a>
      <a href="#" data-tab="child">My Child</a>
      <a href="#" data-tab="video">Video Calls</a>
      <a href="#" data-tab="notes">Notes</a>
      <a href="#" data-tab="history">History</a>
    </nav>
    <div class="signout"><button onclick="JW.signOut()">Sign out</button></div>
  </aside>

  <main class="main">
    <h1 id="title">Progress</h1>
    <div id="content"></div>
  </main>
</div>

<script>
(async () => {
  const auth = await JW.requireAuth("parent");
  if (!auth) return;

  const file = await JW.getMyChild();
  if (!file) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Your account isn't linked to a child yet. Please ask your BCBA to link it — call (254) 415-2235.</div>`;
    return;
  }

  const approved = file.notes.filter(n => n.status === "approved");
  const behaviors = [...new Set(file.behavior.map(b => b.behavior).filter(Boolean))];

  // ---- AI summary: plain-language progress overview generated from the child's data ----
  function aiSummary() {
    const bits = [];
    const name = file.client.initials;
    const g = file.goals.length;
    bits.push(`${name} is working on ${g} goal${g === 1 ? "" : "s"} right now.`);

    const counts = {};
    file.behavior.forEach(r => {
      if (r.behavior) counts[r.behavior] = (counts[r.behavior] || 0) + Number(r.count || 0);
    });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    if (top) {
      const t = JWCharts.dailyTotals(file.behavior, top[0], 14);
      const prev = t.slice(0, 7).reduce((a, d) => a + d.value, 0) / 7;
      const cur = t.slice(7).reduce((a, d) => a + d.value, 0) / 7;
      if (cur < prev) bits.push(`"${top[0]}" is trending down (about ${cur.toFixed(1)} per day this week vs ${prev.toFixed(1)} last week) — great progress.`);
      else if (cur > prev) bits.push(`"${top[0]}" is up this week (about ${cur.toFixed(1)} per day vs ${prev.toFixed(1)} last week) — the team is watching this closely.`);
      else bits.push(`"${top[0]}" held steady this week.`);
    } else {
      bits.push(`No behavior data recorded yet — check back after the next session.`);
    }

    bits.push(approved.length
      ? `Your team has shared ${approved.length} note${approved.length === 1 ? "" : "s"} with you.`
      : `No team notes shared yet.`);
    return bits.join(" ");
  }

  async function loadUpcoming() {
    const { data } = await JW.supabase.from("sessions").select("*")
      .eq("client_id", file.client.id).gte("starts_at", new Date().toISOString())
      .order("starts_at").limit(5);
    return data || [];
  }
  async function loadPast() {
    const { data } = await JW.supabase.from("sessions").select("*")
      .eq("client_id", file.client.id).lt("starts_at", new Date().toISOString())
      .order("starts_at", { ascending: false }).limit(10);
    return data || [];
  }

  const videoCard = (s) => {
    const when = new Date(s.starts_at);
    const now = new Date();
    const live = s.room_url && Math.abs(when - now) < 1000 * 60 * 90;
    return `
    <div class="list-card">
      <h3>${when.toLocaleString()}${live ? ' <span class="pill" style="background:#1a7f4b;color:#fff">Live now</span>' : ""}</h3>
      <div style="margin-top:10px"><button class="btn" data-join-call="${s.id}">Join video call</button></div>
      <div class="meta" style="margin-top:8px">Allow camera and microphone access when asked.</div>
    </div>`;
  };


  function errText(e) {
    if (e && e.message) return e.message;
    try { return JSON.stringify(e); } catch (_) { return String(e); }
  }

  // Join (or create) this session's private room, inside the portal.
  let pvCall = null;
  async function joinCall(sessionId, btn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Joining…";
    try {
      const { data, error } = await JW.supabase.functions.invoke("create-session-room", {
        body: { session_id: sessionId }
      });
      if (error) throw error;
      if (!data || data.error) throw new Error((data && data.error) || "No room URL returned.");
      document.getElementById("pvRoom").style.display = "block";
      if (pvCall) { await pvCall.leave(); pvCall = null; }
      pvCall = window.DailyIframe.createFrame(document.getElementById("pvMount"), {
        iframeStyle: { width: "100%", height: "420px", border: "0", borderRadius: "12px" }
      });
      await pvCall.join({ url: data.room_url });
      document.getElementById("pvRoom").scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) {
      alert("Could not join the call: " + errText(e));
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }
  function wireJoinButtons() {
    document.querySelectorAll("[data-join-call]").forEach(b => {
      if (!b.dataset.wired) {
        b.dataset.wired = "1";
        b.addEventListener("click", () => joinCall(b.dataset.joinCall, b));
      }
    });
  }
  const upcoming = await loadUpcoming();
  const past = await loadPast();

  document.getElementById("content").innerHTML = `
    <section class="ptab active" id="tab-progress">
      <h2>AI Summary</h2>
      <div class="list-card"><p style="white-space:pre-wrap">${aiSummary()}</p></div>
      <div class="stat-grid">
        <div class="stat"><div class="num">${file.goals.length}</div><div class="lbl">Active goals</div></div>
        <div class="stat"><div class="num">${approved.length}</div><div class="lbl">Shared notes</div></div>
        <div class="stat"><div class="num">${upcoming.length}</div><div class="lbl">Upcoming sessions</div></div>
      </div>
      <h2>Goals</h2>
      ${file.goals.map(g => `
        <div class="list-card"><h3>${g.title}</h3><div class="meta">${g.target_text || ""}</div></div>`).join("")
        || `<div class="list-card"><div class="meta">No goals shared yet.</div></div>`}
      <h2>Progress graph</h2>
      <div class="field" style="max-width:320px"><label>Behavior</label>
        <select id="bSel">${behaviors.map(b => `<option>${b}</option>`).join("")}</select>
      </div>
      <canvas class="graph" id="graph"></canvas>
    </section>

    <section class="ptab" id="tab-child">
      <h2>My Child</h2>
      <div class="list-card">
        <h3>${file.client.initials}</h3>
        <div class="meta">Age: ${file.client.age ?? "—"}</div>
        <div class="meta">BCBA: ${file.client.bcba || "—"}</div>
        <div class="meta">Since: ${new Date(file.client.created_at).toLocaleDateString()}</div>
      </div>
      <h2>Care team</h2>
      <div class="list-card"><div class="meta">Your BCBA: ${file.client.bcba || "—"}</div>
      <div class="meta">Questions? Call (254) 415-2235 or email lmanicones@hotmail.com</div></div>
    </section>

    <section class="ptab" id="tab-video">
      <h2>Video Calls</h2>
      <p class="fineprint" style="color:#B9B3D6">Tap <b>Join video call</b> on any upcoming session — you'll join your BCBA with camera and microphone right here.</p>
      <div id="pvRoom" style="display:none;margin-bottom:16px">
        <div id="pvMount"></div>
        <div style="margin-top:8px"><button class="btn btn-sm btn-outline" id="pvLeave">Leave call</button></div>
      </div>
      <div id="upcoming"></div>
    </section>

    <section class="ptab" id="tab-notes">
      <h2>Notes from your team</h2>
      ${approved.map(n => `
        <div class="list-card">
          <div class="meta">${new Date(n.created_at).toLocaleDateString()}</div>
          <p style="white-space:pre-wrap">${n.content || ""}</p>
        </div>`).join("")
        || `<div class="list-card"><div class="meta">No shared notes yet.</div></div>`}
    </section>

    <section class="ptab" id="tab-history">
      <h2>History</h2>
      ${past.map(s => `
        <div class="list-card"><div class="meta">${new Date(s.starts_at).toLocaleString()} · ${s.status}</div></div>`).join("")
        || `<div class="list-card"><div class="meta">No past sessions yet.</div></div>`}
    </section>
  `;

  // ---- Tab switching ----
  const titles = { progress: "Progress", child: "My Child", video: "Video Calls", notes: "Notes", history: "History" };
  document.querySelectorAll("#pnav a").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.querySelectorAll("#pnav a").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    document.querySelectorAll(".ptab").forEach(t => t.classList.remove("active"));
    document.getElementById("tab-" + a.dataset.tab).classList.add("active");
    document.getElementById("title").textContent = titles[a.dataset.tab] + (a.dataset.tab === "progress" ? ` — ${file.client.initials}` : "");
    if (a.dataset.tab === "progress") draw();
  }));

  const draw = () => {
    const sel = document.getElementById("bSel");
    const cv = document.getElementById("graph");
    if (sel && cv) JWCharts.drawLineChart(cv, JWCharts.dailyTotals(file.behavior, sel.value || null, 14));
  };
  document.getElementById("bSel")?.addEventListener("change", draw);
  draw();
  window.addEventListener("resize", draw);

  // Render upcoming video sessions and wire the Join buttons.
  function renderUpcoming(list) {
    document.getElementById("upcoming").innerHTML =
      list.map(videoCard).join("") || `<div class="list-card"><div class="meta">Nothing scheduled.</div></div>`;
    wireJoinButtons();
  }
  renderUpcoming(upcoming);

  document.getElementById("pvLeave").addEventListener("click", async () => {
    if (pvCall) { await pvCall.leave(); pvCall = null; }
    document.getElementById("pvRoom").style.display = "none";
  });

  // Keep the video tab fresh: re-check for started calls every 30 seconds.
  setInterval(async () => {
    try {
      renderUpcoming(await loadUpcoming());
    } catch (e) { /* keep old list on error */ }
  }, 30000);
})();
</script>
</body>
</html>
